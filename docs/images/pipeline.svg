  <text x="450" y="190" text-anchor="middle" font-size="14" fill="#1f2328">Upload <tspan font-weight="700">Name_INSTAGRAM_1080p.mp4</tspan>  ·  "Upload at highest quality" on  ·  AirDrop, not WhatsApp</text>
