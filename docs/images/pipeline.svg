  </defs>
  <rect width="900" height="250" rx="14" fill="#ffffff"/>
  <g font-size="14" text-anchor="middle">
    <rect x="20" y="60" width="140" height="84" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
